      <rect x="-12" y="-132" width="24" height="40" rx="10" transform="rotate(225)"/>
      <rect x="-12" y="-132" width="24" height="40" rx="10" transform="rotate(270)"/>
      <rect x="-12" y="-132" width="24" height="40" rx="10" transform="rotate(315)"/>
    </g>
