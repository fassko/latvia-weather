    </linearGradient>
    <radialGradient id="sun" cx="42%" cy="38%" r="68%">
      <stop offset="0" stop-color="#ffe56a"/>
      <stop offset="1" stop-color="#f5b400"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
